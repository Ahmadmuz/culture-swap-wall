<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Culture Swap Wall">
  <rect width="64" height="64" rx="14" fill="#fbf4e8"/>
  <!-- left bubble -->
  <path d="M31 13 H15 Q9 13 9 19 v9 q0 6 5.5 7.6 V40 l5-3.4 H31 Z" fill="#ffffff" stroke="#5C4630" stroke-width="3.4" stroke-linejoin="round"/>
  <!-- right bubble -->
  <path d="M33 13 h16 q6 0 6 6 v9 q0 6-5.5 7.6 V40 l-5-3.4 H33 Z" fill="#E0BC5B" stroke="#5C4630" stroke-width="3.4" stroke-linejoin="round"/>
  <!-- exchange arrows between the bubbles -->
  <g fill="none" stroke="#5C4630" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M25 20 h13"/><path d="M35 17 l3.2 3-3.2 3"/>
    <path d="M39 26 H26"/><path d="M29 23 l-3.2 3 3.2 3"/>
  </g>
  <!-- brick wall base -->
  <g fill="#5C4630">
    <rect x="12" y="46" width="18" height="6" rx="1.4"/>
    <rect x="33" y="46" width="19" height="6" rx="1.4"/>
    <rect x="12" y="55" width="12" height="5" rx="1.4"/>
    <rect x="27" y="55" width="14" height="5" rx="1.4"/>
    <rect x="44" y="55" width="8" height="5" rx="1.4"/>
  </g>
</svg>
